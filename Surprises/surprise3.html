<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Surprise 3</title>
<style>
body {
    margin: 0; padding: 0;
    background: #d9dde1;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    flex-direction: column;
}

/* CONTAINER */
.container {
    width: 60%;
    max-width: 700px;
    background: #e8e6e1;
    padding: 50px 50px;
    border-radius: 10px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
    text-align: center;
    box-sizing: border-box;
}

/* TEXT */
.text {
    font-size: 1rem;
    line-height: 1.6;
    text-align: justify;
}

/* FIRST LINE FIX */
#lineContainer div:first-child {
    text-align: center;
    font-weight: bold;
}

/* OTHER LINES FADE-IN */
#lineContainer div:not(:first-child) {
    opacity: 0;
    animation: fadeIn 0.5s forwards;
    margin-bottom: 10px;
}
@keyframes fadeIn { to { opacity: 1; } }

#hint, #endMessage {
    margin-top: 10px;
    font-size: 0.9rem;
    color: #555;
    text-align: center;
    opacity: 0.8;
}
#endMessage { font-weight: bold; display: none; }

/* FINAL PAGE */
.final {
    display: none;
    font-size: 2rem;
    text-align: center;
    animation: popText 0.8s ease;
}
@keyframes popText { 0%{transform:scale(0.7);opacity:0;}100%{transform:scale(1);opacity:1;} }
.final p { background:linear-gradient(45deg,#ff7e5f,#feb47b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 5px 15px rgba(0,0,0,0.2);}

/* BUTTONS */
.next-btn { display:block; margin-top:20px; text-align:right; cursor:pointer; text-decoration:underline; }
.back-btn { display:none; position:fixed; right:20px; bottom:20px; text-decoration:none; background:#e6c86e; padding:12px 25px; border-radius:25px; color:black; font-weight:bold; box-shadow:3px 5px 0px #90b36b; }

/* POLAROIDS */
.polaroid-container { position:fixed; width:100%; height:100%; top:0; left:0; display:none; pointer-events:none; }
.polaroid { position:absolute; background:white; padding:10px 10px 20px 10px; box-shadow:0 6px 15px rgba(0,0,0,0.25); border-radius:6px; transition:0.4s ease; }
.polaroid img { width:100%; }

/* PAGE 1 POSITIONS */
#polaroids-page1 .p1 { --rotate:-10deg; top:5%; left:5%; opacity:0; animation:fadeInPolaroid 1s forwards; animation-delay:0.3s; width:150px; }
#polaroids-page1 .p2 { --rotate:10deg; top:5%; right:5%; opacity:0; animation:fadeInPolaroid 1s forwards; animation-delay:0.8s; width:150px; }
#polaroids-page1 .p3 { --rotate:5deg; bottom:5%; left:5%; opacity:0; animation:fadeInPolaroid 1s forwards; animation-delay:1.3s; width:150px; }

/* PAGE 2 POSITIONS */
#polaroids-page2 .p1 { --rotate:-5deg; top:5%; left:5%; opacity:0; width:140px; animation:popInPolaroid 0.8s forwards; animation-delay:0.3s; }
#polaroids-page2 .p2 { --rotate:7deg; top:5%; right:5%; opacity:0; width:170px; animation:popInPolaroid 0.8s forwards; animation-delay:0.8s; }
#polaroids-page2 .p3 { --rotate:-3deg; bottom:5%; left:5%; opacity:0; width:140px; animation:popInPolaroid 0.8s forwards; animation-delay:1.3s; }

/* MOBILE PAGE2 ADJUST */
@media(max-width:768px){
    #polaroids-page2 .p1{top:4%; left:5%; width:120px;}
    #polaroids-page2 .p2{top:4%; right:5%; width:140px;}
    #polaroids-page2 .p3{bottom:2%; left:10%; width:120px;}
}
@media(max-width:480px){
    #polaroids-page2 .p1{width:100px;}
    #polaroids-page2 .p2{width:120px;}
    #polaroids-page2 .p3{width:90px;}
}

/* ANIMATIONS */
@keyframes fadeInPolaroid{from{opacity:0; transform:translateY(30px) scale(0.9) rotate(0deg);}to{opacity:1; transform:translateY(0) scale(1) rotate(var(--rotate));}}
@keyframes popInPolaroid{0%{opacity:0; transform:scale(0.5) rotate(var(--rotate));}60%{opacity:1; transform:scale(1.2) rotate(var(--rotate));}100%{opacity:1; transform:scale(1) rotate(var(--rotate));}}

/* CONFETTI */
#confetti-container{position:fixed;width:100%;height:100%;top:0;left:0;pointer-events:none;overflow:hidden;z-index:999;}
.confetti{position:absolute;width:8px;height:12px;opacity:0.9;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0;}}

/* MEDIA QUERIES */
@media(max-width:768px){.container{padding:20px 15px;}.text{font-size:0.95rem;line-height:1.5;}.final{font-size:1.5rem;}.polaroid{width:35vw;max-width:150px;}.next-btn{font-size:0.9rem;}.back-btn{padding:10px 20px;font-size:0.9rem;}}
@media(max-width:480px){.container{width:95%;padding:15px 10px;}.text{font-size:0.9rem;line-height:1.4;}.final{font-size:1.2rem;}.polaroid{width:40vw;max-width:120px;}.next-btn{font-size:0.85rem;}.back-btn{padding:8px 15px;font-size:0.85rem;}}
</style>
</head>
<body>

<!-- PAGE 1 POLAROIDS -->
<div id="polaroids-page1" class="polaroid-container">
    <div class="polaroid p1"><img src="../images/photo3.jpg"></div>
    <div class="polaroid p2"><img src="../images/photo4.jpg"></div>
    <div class="polaroid p3"><img src="../images/photo5.jpg"></div>
</div>

<!-- PAGE 2 POLAROIDS -->
<div id="polaroids-page2" class="polaroid-container">
    <div class="polaroid p1"><img src="../images/img1.jpg"></div>
    <div class="polaroid p2"><img src="../images/img2.jpg"></div>
    <div class="polaroid p3"><img src="../images/img3.jpg"></div>
</div>

<div id="confetti-container"></div>

<div class="container">
    <!-- PAGE 1 -->
    <div id="page1" class="text">
        <div id="lineContainer">
            <div>Happy Birthday Bestie! 🎉</div>
        </div>
        <div id="hint">Press Enter to read...</div>
        <div id="endMessage">Press Next to continue...</div>
        <span class="next-btn" onclick="showFinal()">Next</span>
    </div>

    <!-- PAGE 2 -->
    <div id="page2" class="final">
        <p>Once Again Wishing U A <br>Very Happy Birthday Diiii !!!</p>
    </div>
</div>

<a href="../index.html" id="backBtn" class="back-btn">BACK ◀</a>

<script>
const lines=[
    "You have a sparkle that makes everything feel lighter and happier",
    "You’ve been a constant source of support, laughter, and comfort",
    "You’ve stood by me through moments when I really needed someone",
    "Your kindness, patience, and understanding make you truly special"
];

let currentLine=0;

function showNextLine(){
    if(currentLine<lines.length){
        const container=document.getElementById("lineContainer");
        const newLine=document.createElement("div");
        newLine.textContent=lines[currentLine];
        container.appendChild(newLine);
        currentLine++;
        if(currentLine===lines.length){
            document.getElementById("endMessage").style.display="block";
            document.getElementById("hint").style.display="none";
        }
    }
}

document.addEventListener("keydown", e=>{if(e.key==="Enter") showNextLine();});
document.addEventListener("click", showNextLine);

window.addEventListener("load", ()=>{
    document.getElementById("page1").style.display="block";
    document.getElementById("page2").style.display="none";
    document.getElementById("polaroids-page1").style.display="block";
    document.getElementById("polaroids-page2").style.display="none";
});

function showFinal(){
    document.getElementById("page1").style.display="none";
    document.getElementById("page2").style.display="block";
    document.getElementById("polaroids-page1").style.display="none";
    document.getElementById("polaroids-page2").style.display="block";
    document.getElementById("backBtn").style.display="block";
    launchConfetti();
}

function launchConfetti(){
    const container=document.getElementById("confetti-container");
    for(let i=0;i<50;i++){
        const confetti=document.createElement("div");
        confetti.classList.add("confetti");
        confetti.style.left=Math.random()*100+"vw";
        const colors=["#ff7e5f","#feb47b","#ffcc00","#66ffcc","#ff6699"];
        confetti.style.background=colors[Math.floor(Math.random()*colors.length)];
        confetti.style.animationDuration=(Math.random()*2+2)+"s";
        container.appendChild(confetti);
        setTimeout(()=>{confetti.remove();},4000);
    }
}
</script>
</body>
</html>
