<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surprise 3</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #d9dde1;
    font-family: 'Courier New', monospace;

    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow-x: hidden;
}

/* CONTAINER */
.container {
    width: 85%;
    max-width: 550px;
    background: #e8e6e1;
    padding: 40px 25px 25px;
    border-radius: 10px;
    box-shadow: 0px 10px 30px rgba(0,0,0,0.1);
    text-align: left;
    position: relative;
    z-index: 2;
}

/* TEXT */
#lineContainer div {
    opacity: 0;
    animation: fadeIn 0.5s forwards;
    margin-bottom: 10px;
    font-size: 16px;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* HINT */
#hint, #endMessage {
    margin-top: 15px;
    font-size: 14px;
    color: #555;
    text-align: center;
}

#endMessage {
    display: none;
    font-weight: bold;
}

/* FINAL PAGE */
.final {
    display: none;
    font-size: 24px;
    text-align: center;
}

/* BUTTON */
.next-btn {
    display: block;
    margin-top: 20px;
    text-align: right;
    cursor: pointer;
    text-decoration: underline;
}

/* BACK BUTTON */
.back-btn {
    display: none;
    position: fixed;
    right: 20px;
    bottom: 30px;
    background: #e6c86e;
    padding: 10px 18px;
    border-radius: 25px;
    font-weight: bold;
    color: black;
    text-decoration: none;
}

/* POLAROIDS */
.polaroid-container {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
    display: none;
}

.polaroid {
    position: absolute;
    width: 120px;
    background: white;
    padding: 8px 8px 15px;
    box-shadow: 0px 6px 15px rgba(0,0,0,0.2);
    border-radius: 6px;
}

.polaroid img {
    width: 100%;
}

#p1 { top: 2%; left: 5%; transform: rotate(-10deg); }
#p2 { top: 2%; right: 5%; transform: rotate(8deg); }
#p5 { bottom: 5%; left: 2%; transform: rotate(3deg); }

/* CONFETTI BURST */
#confetti-container {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 999;
}

.confetti {
    position: absolute;
    width: 8px;
    height: 12px;
    background: red;
    top: 50%;
    left: 50%;
    opacity: 1;
}

@keyframes burst {
    from {
        transform: translate(-50%, -50%) rotate(0deg);
        opacity: 1;
    }
    to {
        transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(720deg);
        opacity: 0;
    }
}

</style>
</head>

<body>

<!-- CONFETTI -->
<div id="confetti-container"></div>

<!-- POLAROIDS -->
<div id="polaroids" class="polaroid-container">
    <div class="polaroid" id="p1"><img src="../images/img1.jpg"></div>
    <div class="polaroid" id="p2"><img src="../images/img2.jpg"></div>
    <div class="polaroid" id="p5"><img src="../images/photo4.jpg"></div>
</div>

<div class="container">

    <!-- PAGE 1 -->
    <div id="page1">
        <div id="lineContainer"></div>
        <div id="hint">Tap or press Enter to read...</div>
        <div id="endMessage">Press Next to continue...</div>
        <span class="next-btn" onclick="nextPage()">Next</span>
    </div>

    <!-- PAGE 2 -->
    <div id="page2" class="final">
        <p>Once Again Wishing U A <br> Very Happy Birthday Diiii !!! 🎉</p>
    </div>

</div>

<a href="../index.html" class="back-btn" id="backBtn">BACK ◀</a>

<script>
const lines = [
"Happy Birthday Bestie! 🎉",
"You have a sparkle that makes everything feel lighter and happier",
"You’ve been a constant source of support, laughter, and comfort",
"You’ve stood by me through moments when I really needed someone",
"Your kindness, patience, and understanding make you truly special"
];

let i = 0;

function showLine() {
    if (i < lines.length) {
        let div = document.createElement("div");
        div.textContent = lines[i];

        if (i === 0) {
            div.style.textAlign = "center";
            div.style.fontWeight = "bold";
            div.style.fontSize = "20px";
        }

        document.getElementById("lineContainer").appendChild(div);
        i++;

        if (i === lines.length) {
            document.getElementById("hint").style.display = "none";
            document.getElementById("endMessage").style.display = "block";
        }
    }
}

document.addEventListener("click", showLine);
document.addEventListener("keydown", e => { if (e.key === "Enter") showLine(); });

window.onload = showLine;

/* CONFETTI BURST FUNCTION */
function launchConfetti() {
    const container = document.getElementById("confetti-container");

    for (let i = 0; i < 120; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");

        // random direction
        const angle = Math.random() * 2 * Math.PI;
        const distance = 200 + Math.random() * 300;

        const x = Math.cos(angle) * distance + "px";
        const y = Math.sin(angle) * distance + "px";

        confetti.style.setProperty("--x", x);
        confetti.style.setProperty("--y", y);

        // colors
        confetti.style.backgroundColor =
            ["#ff4d4d","#ffd11a","#4dff88","#4db8ff","#ff66cc"][Math.floor(Math.random()*5)];

        // APPLY animation AFTER adding (important!)
        container.appendChild(confetti);

        requestAnimationFrame(() => {
            confetti.style.animation = "burst 1.2s ease-out forwards";
        });

        setTimeout(() => confetti.remove(), 1200);
    }
}

/* NEXT PAGE */
function nextPage() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";

    document.getElementById("polaroids").style.display = "block";
    document.getElementById("backBtn").style.display = "block";

    launchConfetti(); // 🎉 burst here
}
</script>

</body>
</html>
