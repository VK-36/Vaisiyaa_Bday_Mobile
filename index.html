<!DOCTYPE html>
<html>
<head>
    <title>Vaisiyaa Bday</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff0f5;
            margin: 0;
        }

        .title {
            margin-top: 50px;
            color: #ff4d88;
            font-size: 2rem;
        }

        .instruction {
            margin-top: 10px;
            color: #555;
            font-size: 1rem;
            opacity: 0.8;
        }

        /* GRID LAYOUT */
        .grid {
            display: grid;
            grid-template-areas:
                "top"
                "bottom";
            justify-items: center;
            gap: 50px;
            margin: 60px 20px;
        }

        .top { grid-area: top; }

        .bottom {
            grid-area: bottom;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ENVELOPE STYLE */
        .card {
            width: 180px;
            height: 120px;
            background: #fff;
            position: relative;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        /* Envelope flap */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            border-left: 90px solid transparent;
            border-right: 90px solid transparent;
            border-top: 60px solid #ffb6c1;
        }

        /* Text inside */
        .card a {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-decoration: none;
            color: #ff4d88;
            font-weight: bold;
        }

        /* Hover effect */
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        /* MEDIA QUERIES */
        @media (max-width: 768px) {
            .title { font-size: 1.8rem; }
            .instruction { font-size: 0.95rem; }
            .bottom { gap: 30px; }
        }

        @media (max-width: 480px) {
            .title { font-size: 1.5rem; margin-top: 30px; }
            .instruction { font-size: 0.85rem; }
            .bottom { flex-direction: column; gap: 20px; }
        }
    </style>
</head>
<body>

<h1 class="title">For My Bestieee 💕</h1>
<p class="instruction">Click any envelope to open</p>

<div class="grid">
    <!-- Top envelope -->
    <div class="card top" onclick="goToPage('Surprises/surprise1.html')">
        <a href="#">Surprise 1</a>
    </div>

    <!-- Bottom envelopes -->
    <div class="bottom">
        <div class="card" onclick="goToPage('Surprises/surprise2.html')">
            <a href="#">Surprise 2</a>
        </div>
        <div class="card" onclick="goToPage('Surprises/surprise3.html')">
            <a href="#">Surprise 3</a>
        </div>
    </div>
</div>

<script>
function goToPage(page) {
    window.location.href = page;
}
</script>

</body>
</html>
