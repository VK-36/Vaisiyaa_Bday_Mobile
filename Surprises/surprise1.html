<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday VK</title>

<style>

/* BODY */
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(to top, #ffd1dc, #ffe6f0);
  text-align: center;
  overflow-x: hidden;
}

/* BACK BUTTON */
.back-btn {
  position: absolute;
  top: 15px;
  left: 15px;
  padding: 8px 12px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
}

/* BANNER */
.banner {
  font-size: 28px;
  font-weight: bold;
  margin-top: 60px;
}

/* REVEAL BUTTON */
.reveal-btn {
  margin: 20px auto;
  padding: 15px;
  width: 80%;
  max-width: 250px;
  background: #ff4d6d;
  color: white;
  font-size: 16px;
  border-radius: 30px;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.reveal-btn:hover {
  transform: scale(1.05);
  background: #ff1e4d;
}

/* BALLOONS */
.balloon {
  width: 40px;
  height: 50px;
  border-radius: 50%;
  position: absolute;
  bottom: -60px;
  animation: float 6s infinite;
}

.balloon:nth-child(1) { left: 10%; background: red; animation-delay: 0s;}
.balloon:nth-child(2) { left: 30%; background: blue; animation-delay: 2s;}
.balloon:nth-child(3) { left: 60%; background: green; animation-delay: 1s;}
.balloon:nth-child(4) { left: 80%; background: purple; animation-delay: 3s;}

@keyframes float {
  0% { transform: translateY(0); }
  100% { transform: translateY(-800px); }
}

/* POLAROIDS */
.polaroid-container {
  position: relative;
  margin-top: 40px;
  height: 300px;
}

.polaroid {
  width: 120px;
  background: white;
  padding: 10px 10px 20px;
  position: absolute;
  box-shadow: 0 6px 12px rgba(0,0,0,0.3);
  border-radius: 8px;
  text-align: center;
}

.polaroid img {
  width: 100%;
}

/* positions */
.left { left: 10%; transform: rotate(-10deg); }
.center { left: 50%; transform: translateX(-50%); }
.right { right: 10%; transform: rotate(10deg); }

/* POPPER */
.popper {
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  font-size: 40px;
  animation: pop 1s infinite alternate;
}

@keyframes pop {
  from { transform: translateX(-50%) scale(1); }
  to { transform: translateX(-50%) scale(1.3); }
}

/* CONFETTI */
.confetti {
  width: 10px;
  height: 10px;
  position: absolute;
  top: -10px;
  animation: fall linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(800px) rotate(360deg);
  }
}

</style>
</head>

<body>

<button class="back-btn" onclick="history.back()">⬅ Back</button>

<div class="banner">🎉 Happy Birthday VK 🎉</div>

<!-- TAP TO REVEAL -->
<div class="reveal-btn" onclick="goToMainPage()">
  🎁 Tap to Reveal Surprise
</div>

<!-- BALLOONS -->
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>
<div class="balloon"></div>

<!-- POLAROIDS -->
<div class="polaroid-container">

  <div class="polaroid left">
    <img src="../images/photo1.jpg">
    <p>Memory 1</p>
  </div>

  <div class="polaroid center">
   <img src="../images/photo2.jpg">
    <p>Best Moment</p>
  </div>

  <div class="polaroid right">
    <img src="../images/photo6.jpg">
    <p>Fun Time</p>
  </div>

</div>

<!-- POPPER -->
<div class="popper">🎊</div>

<script>

/* CONFETTI GENERATOR */
for (let i = 0; i < 60; i++) {
  let confetti = document.createElement("div");
  confetti.classList.add("confetti");

  confetti.style.left = Math.random() * 100 + "vw";
  confetti.style.backgroundColor =
    ["red", "blue", "green", "yellow", "purple"][Math.floor(Math.random() * 5)];
  confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";

  document.body.appendChild(confetti);
}

/* REVEAL BUTTON FUNCTION */
function goToMainPage() {
  document.body.style.transition = "0.5s";
  document.body.style.opacity = "0";

  setTimeout(() => {
    window.location.href = "main.html"; // CHANGE if needed
  }, 500);
}

</script>

</body>
</html>
